name: rideconnect_app
description: RideConnect — Enterprise Carpooling Platform mobile app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # Networking
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Local Storage / Persistence
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  fl_chart: ^0.67.0

  # Forms & Validation
  form_validator: ^2.1.1

  # Date & Time
  intl: ^0.19.0

  # Utilities
  equatable: ^2.0.5
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  logger: ^2.3.0
  connectivity_plus: ^6.0.3

  # Razorpay (payments)
  # razorpay_flutter: ^1.3.6  # enable when ready for native Razorpay SDK

  # Socket.IO
  # socket_io_client: ^2.0.3+1  # enable for real-time chat

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
